<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сторінку не знайдено — L7 iHOME</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#4AA0F5">
  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=7">
  <style>
    .nf { min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-8); background: var(--bg-studio); }
    .nf-inner { max-width: 520px; }
    .nf img { width: 64px; height: 64px; margin: 0 auto var(--space-6); }
    .nf .code { font-family: var(--font-mono); font-size: var(--fs-label); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); }
    .nf h1 { font-weight: var(--fw-extrabold); font-size: clamp(32px, 5vw, 48px); letter-spacing: var(--ls-tight); margin: var(--space-3) 0 var(--space-4); }
    .nf p { color: var(--text-muted); font-size: var(--fs-body-lg); margin-bottom: var(--space-8); }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-inner">
      <img src="assets/logo-mark.svg" alt="L7 iHOME">
      <div class="code">Помилка 404</div>
      <h1>Сторінку не знайдено</h1>
      <p>Можливо, її переміщено або видалено. Повертайтесь на головну, щоб обрати капсульний будинок.</p>
      <a href="/l7-ihome/" class="btn btn--primary">На головну →</a>
    </div>
  </main>
</body>
